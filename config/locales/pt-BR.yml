    eyebrow: "Estudo guiado"
    home_title: "A origem de uma ideia que mudou a computação"
    home_description: "Conheça a história da Máquina de Turing e por que ela ainda ajuda a explicar o que os computadores podem fazer."
    home_cta: "Ir para estudo"
    catalog_title: "Conteúdos para estudar"
    catalog_description: "Escolha um módulo de estudo para aprender no seu ritmo. Cada conteúdo combina leitura, exemplos e explorações interativas."
    back_to_catalog: "Todos os conteúdos de estudo"
    catalog:
      available: "Disponível"
      start: "Estudar este tópico"
      turing_machine:
        title: "Máquina de Turing"
        description: "Conheça a ideia que ajudou a fundar a ciência da computação, seus limites e uma simulação passo a passo."
    title: "A história da Máquina de Turing"
    description: "Antes dos computadores modernos existirem, Alan Turing imaginou uma máquina simples capaz de seguir instruções. Essa ideia se tornou uma das bases da ciência da computação."
    libras:
      label: "Modo LIBRAS · conteúdo visual"
      introduction: "Veja a ideia principal com imagens, palavras curtas e a simulação."
      notice: "O texto foi reduzido. Use as imagens e a fita interativa para acompanhar a explicação."
      history_label: "História"
      history_title: "Alan Turing e uma ideia nova"
      history_caption: "Alan Turing, 1951."
      history_1: "Em 1936, Turing imaginou uma máquina simples."
      history_2: "A máquina segue regras, passo a passo."
      history_3: "Essa ideia ajudou a criar a computação moderna."
      model_label: "Como funciona"
      model_title: "Três partes"
      model:
        tape: "Fita: guarda símbolos."
        head: "Cabeça: lê e escreve."
        rules: "Regras: dizem o próximo passo."
      diagram_translation: "Tradução: Tape = fita. Read / write head = cabeça que lê e escreve. Finite Control = controle."
      diagram_description: "Imagem: a fita fica em cima. A cabeça lê um símbolo. A caixa de baixo escolhe a regra. q0, q1 e q2 são estados."
      importance_label: "Por que importa"
      importance_title: "Computadores e ideias"
      importance_text: "A Máquina de Turing mostra como um computador pode seguir instruções. Ela também ajuda a entender que alguns problemas não têm solução por algoritmo."
      bletchley_caption: "Bletchley Park: lugar ligado ao trabalho de Turing durante a Segunda Guerra Mundial."
    history_label: "01 · Contexto histórico"
    featured_title: "Uma máquina imaginada no papel"
    featured_paragraph_one: "Em 1936, Alan Turing apresentou um modelo teórico: uma fita dividida em casas, uma cabeça que lê e escreve símbolos e um conjunto pequeno de regras. A máquina não foi proposta como um computador de uso diário, mas como uma forma precisa de pensar sobre cálculos."
    timeline_label: "Linha do tempo"
    timeline_title: "Da ideia ao legado"
    timeline_step_1: "1936: Turing publica o modelo que ficou conhecido como Máquina de Turing."
    timeline_step_2: "Décadas seguintes: a ideia passa a orientar estudos sobre algoritmos, linguagens e computadores."
    timeline_step_3: "Hoje: o modelo continua sendo usado para ensinar computação, analisar programas e discutir seus limites."
    model_label: "02 · O modelo"
    model_title: "Regras simples, passos precisos"
    model_description: "A cada passo, a máquina observa o símbolo atual, altera-o se necessário, move-se para a esquerda ou para a direita e muda de estado. Mesmo com elementos tão simples, pode representar qualquer procedimento que possa ser descrito por instruções claras."
    importance_label: "Por que isso importa"
    importance_title: "Uma ideia simples, consequências profundas"
    importance:
      limits:
        title: "Limites do cálculo"
        description: "Ela permite investigar quais problemas podem ser resolvidos por algoritmos e quais permanecem impossíveis de automatizar."
      languages:
        title: "Instruções e algoritmos"
        description: "A separação entre estados, símbolos e regras ajuda a entender como programas transformam dados passo a passo."
      legacy:
        title: "Base da computação"
        description: "Mesmo abstrata, essa máquina influenciou a forma como pesquisadores pensam sobre computadores e a ciência da computação."
    simulator:
      label: "Exploração interativa"
      title: "Uma fita em movimento"
      description: "Este exemplo usa uma regra simples: ao ler 0, a máquina escreve 1; ao ler 1, escreve 0. A cabeça avança uma casa por vez até encontrar o espaço em branco."
      description_libras: "A cabeça lê um símbolo, troca 0 por 1 ou 1 por 0 e avança na fita."
      current_state: "Estado atual"
      tape_label: "Fita da Máquina de Turing"
      initial_message: "Pronta para ler o primeiro símbolo da fita."
      read_zero: "Leu 0, escreveu 1 e moveu a cabeça para a direita."
      read_one: "Leu 1, escreveu 0 e moveu a cabeça para a direita."
      halted_message: "Leu o espaço em branco: a máquina chegou ao estado de parada."
      start: "Executar"
      pause: "Pausar"
      step: "Próximo passo"
      reset: "Reiniciar"
    images:
      alan_alt: "Retrato em preto e branco de Alan Turing"
      alan_caption: "Alan Turing, 1951."
      diagram_alt: "Diagrama da fita, da cabeça de leitura e do controle de uma Máquina de Turing"
      diagram_translation: "No desenho: Tape significa fita; Read / write head significa cabeça de leitura e escrita; Finite Control significa controle finito."
      diagram_description: "A fita guarda símbolos em casas. A cabeça aponta para uma casa, lê ou troca seu símbolo e se move. O controle finito guarda o estado atual e escolhe a próxima regra; q0, q1 e q2 são exemplos de estados."
      bletchley_alt: "Prédio de Bletchley Park"
      bletchley_caption: "Bletchley Park, local historicamente ligado ao trabalho de Alan Turing durante a Segunda Guerra Mundial."
      credits_title: "Créditos das imagens"
      alan_credit: "Alan Turing (1951) — domínio público, Wikimedia Commons"
      diagram_credit: "Diagrama da Máquina de Turing — domínio público, Kevd1337 via Wikimedia Commons"
      bletchley_credit: "Bletchley Park — domínio público, Matt Crypto via Wikimedia Commons"
