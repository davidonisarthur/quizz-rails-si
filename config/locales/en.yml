  study:
    nav: "Study"
    eyebrow: "Guided study"
    home_title: "The origin of an idea that changed computing"
    home_description: "Learn the history of the Turing machine and why it still helps explain what computers can do."
    home_cta: "Go to study"
    catalog_title: "Study content"
    catalog_description: "Choose a study module to learn at your own pace. Each piece of content combines reading, examples, and interactive explorations."
    back_to_catalog: "All study content"
    catalog:
      available: "Available"
      start: "Study this topic"
      turing_machine:
        title: "Turing machine"
        description: "Learn about the idea that helped found computer science, its limits, and a step-by-step simulation."
    title: "The history of the Turing machine"
    description: "Before modern computers existed, Alan Turing imagined a simple machine able to follow instructions. That idea became one of the foundations of computer science."
    libras:
      label: "LIBRAS mode · visual content"
      introduction: "See the main idea with images, short phrases, and the simulation."
      notice: "The text is shorter. Use the images and interactive tape to follow the explanation."
      history_label: "History"
      history_title: "Alan Turing and a new idea"
      history_caption: "Alan Turing, 1951."
      history_1: "In 1936, Turing imagined a simple machine."
      history_2: "The machine follows rules, step by step."
      history_3: "This idea helped create modern computing."
      model_label: "How it works"
      model_title: "Three parts"
      model:
        tape: "Tape: stores symbols."
        head: "Head: reads and writes."
        rules: "Rules: say what happens next."
      diagram_translation: "Labels: Tape = tape. Read / write head = head that reads and writes. Finite Control = control."
      diagram_description: "Image: the tape is at the top. The head reads one symbol. The box below chooses the rule. q0, q1, and q2 are states."
      importance_label: "Why it matters"
      importance_title: "Computers and ideas"
      importance_text: "The Turing machine shows how a computer can follow instructions. It also helps explain that some problems have no algorithmic solution."
      bletchley_caption: "Bletchley Park: a place connected to Turing's work during World War II."
      resources_label: "LIBRAS support"
      resources_title: "Video and avatar"
      resources_description: "Watch the recorded LIBRAS video when it is available or use the avatar to follow this summary."
      watch_video: "Watch the LIBRAS video"
      video_title: "Pre-recorded LIBRAS video"
      video_pending: "The LIBRAS video for this content will be available soon. In the meantime, use the avatar to follow the summary."
      video_not_supported: "Your browser does not support this video."
    history_label: "01 · Historical context"
    featured_title: "A machine imagined on paper"
    featured_paragraph_one: "In 1936, Alan Turing introduced a theoretical model: a tape divided into cells, a head that reads and writes symbols, and a small set of rules. It was not proposed as an everyday computer, but as a precise way to think about calculations."
    timeline_label: "Timeline"
    timeline_title: "From an idea to a legacy"
    timeline_step_1: "1936: Turing publishes the model that became known as the Turing machine."
    timeline_step_2: "Following decades: the idea guides studies of algorithms, languages, and computers."
    timeline_step_3: "Today: the model is still used to teach computing, analyze programs, and discuss its limits."
    model_label: "02 · The model"
    model_title: "Simple rules, precise steps"
    model_description: "At each step, the machine observes the current symbol, changes it if needed, moves left or right, and changes state. Even with such simple elements, it can represent any procedure that can be described by clear instructions."
    importance_label: "Why it matters"
    importance_title: "A simple idea with deep consequences"
    importance:
      limits:
        title: "Limits of calculation"
        description: "It makes it possible to investigate which problems algorithms can solve and which remain impossible to automate."
      languages:
        title: "Instructions and algorithms"
        description: "The separation between states, symbols, and rules helps explain how programs transform data step by step."
      legacy:
        title: "A computing foundation"
        description: "Although abstract, this machine influenced how researchers think about computers and computer science."
    simulator:
      label: "Interactive exploration"
      title: "A tape in motion"
      description: "This example uses one simple rule: when it reads 0, the machine writes 1; when it reads 1, it writes 0. The head advances one cell at a time until it finds a blank space."
      description_libras: "The head reads one symbol, changes 0 to 1 or 1 to 0, and moves along the tape."
      current_state: "Current state"
      tape_label: "Turing machine tape"
      initial_message: "Ready to read the first symbol on the tape."
      read_zero: "Read 0, wrote 1, and moved the head to the right."
      read_one: "Read 1, wrote 0, and moved the head to the right."
      halted_message: "Read the blank space: the machine reached its halt state."
      start: "Run"
      pause: "Pause"
      step: "Next step"
      reset: "Reset"
    images:
      alan_alt: "Black-and-white portrait of Alan Turing"
      alan_caption: "Alan Turing, 1951."
      diagram_alt: "Diagram of a Turing machine tape, read-write head, and control"
      diagram_translation: "Labels in the diagram: Tape; Read / write head; and Finite Control."
      diagram_description: "The tape stores symbols in cells. The head points to one cell, reads or changes its symbol, and moves. The finite control keeps the current state and chooses the next rule; q0, q1, and q2 are example states."
      bletchley_alt: "Bletchley Park building"
      bletchley_caption: "Bletchley Park, a place historically connected to Alan Turing's work during World War II."
      credits_title: "Image credits"
      alan_credit: "Alan Turing (1951) — public domain, Wikimedia Commons"
      diagram_credit: "Turing machine diagram — public domain, Kevd1337 via Wikimedia Commons"
      bletchley_credit: "Bletchley Park — public domain, Matt Crypto via Wikimedia Commons"
